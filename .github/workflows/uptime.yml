name: Redirect availability check

# Daily check that the redirect domains are reachable WITHOUT a GitHub login
# and land on processtangent.ai. A failed run triggers GitHub's standard
# "Run failed" email to whoever last edited the cron schedule below.

on:
  schedule:
    - cron: '17 13 * * *'   # daily, 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'process-tangent/processtangent-com-redirect'
    runs-on: ubuntu-latest
    steps:
      - name: Check redirect domains
        env:
          TARGET: https://processtangent.ai/
          URLS: >-
            https://processtangent.com/
            http://processtangent.com/
            https://www.processtangent.com/
        run: |
          fail=0
          for url in $URLS; do
            hdr=$(mktemp); body=$(mktemp)
            # Follow redirects so http->https and www->apex hops are allowed.
            out=$(curl -sS -L --max-redirs 5 --retry 3 --retry-all-errors -m 30 \
                    -D "$hdr" -o "$body" -w '%{http_code} %{url_effective}' "$url") || true
            code=${out%% *}; final=${out#* }
            problems=()
            [ "$code" = "200" ] || problems+=("status $code")
            grep -qi '^x-pages-private:' "$hdr" && problems+=("private Pages site (x-pages-private)")
            case "$final" in
              https://github.com/*) problems+=("redirected to GitHub login: $final") ;;
            esac
            grep -q "url=$TARGET" "$body" || problems+=("redirect to $TARGET not found in page")
            if [ ${#problems[@]} -eq 0 ]; then
              echo "OK   $url -> $final"
            else
              echo "::error title=Redirect check failed::$url: ${problems[*]}"
              fail=1
            fi
          done

          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors -m 30 "$TARGET" || true)
          if [ "$code" = "200" ]; then
            echo "OK   $TARGET"
          else
            echo "::error title=Target down::$TARGET returned $code"
            fail=1
          fi
          exit $fail
